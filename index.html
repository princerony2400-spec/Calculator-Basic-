<!DOCTYPE html>
<html>
   <head>
      <title>Calculator</title>
      <meta charset="utf-8">
      <meta name="viewport" contenth"width=device-width ,initial-scale=1">
      <link rel="stylesheet" href="design.css">
      
   </head>
   <body>
      <header>
         <h1>Calculator</h1> <br>
         <p><strong>Developer Mr. R</strong></p>
      </header>
      
      
      <div id="total">
         
      </div>
      
      
      <main id="flex">
         <div id="btn">
            <button id="one" class="num">1</button>
            <button id="two" class="num">2</button>
            <button id="three" class="num">3</button>
            <button id="four" class="num">4</button>
            <button id="five" class="num">5</button>
            <button id="six" class="num">6</button>
            <button id="seven" class="num">7</button>
            <button id="eight" class="num">8</button>
            <button id="nine" class="num">9</button>
            <button id="zero" class="num">0</button>
            <button id="clear" class="clear" style="background: red;">clear</button>
         </div>
         
         <div id="operator">
            <button id="devide" class="use">÷</button>
            <button id="multy" class="use">×</button>
            <button id="minus" class="use">-</button>
            <button id="power" class="use">^</button>
            <button id="plus" class="use">+</button>
            <button id="equal" class="">=</button>
            
         </div>
      </main>
      <script src="logic1.js"></script>
   </body>
</html>
